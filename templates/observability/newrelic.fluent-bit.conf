# Fluent Bit log forwarder for New Relic — host-level singleton
# Managed by dockerHosting - do not edit by hand. Deployed by install-observability.sh
# to /opt/observability/newrelic/fluent-bit/fluent-bit.conf, which the fluent-bit
# service in newrelic.compose.template mounts as /fluent-bit/etc.
#
# Runs as its own container because the agent image (newrelic/infrastructure-bundle)
# carries no Fluent Bit binary, so the agent's logging.d cannot forward anything.
#
# Each pipeline (an [INPUT] plus its filters) is a file in pipelines/, written by
# setup-slowlog-forwarding.sh. pipelines/00-placeholder.conf is always there: an
# @INCLUDE glob that matches no file is a fatal configuration error.
#
# ${NRIA_LICENSE_KEY} and ${NRIA_DISPLAY_NAME} come from the container's environment
# (env_file /etc/observability/newrelic.env, root-only), never from this file.
[SERVICE]
    Parsers_File  /fluent-bit/etc/mariadb-slowlog.parsers.conf

@INCLUDE /fluent-bit/etc/pipelines/*.conf

# The agent tags what it forwards with the host; this does the same, so a slow-log
# entry can be found by host in New Relic.
[FILTER]
    Name          record_modifier
    Match         mariadb.slowlog.*
    Record        hostname ${NRIA_DISPLAY_NAME}

# EU endpoint, matching the agent's NEW_RELIC_REGION: EU (newrelic.compose.template)
# and the egress allowlist (newrelic.egress). A US account needs
# https://log-api.newrelic.com/log/v1 and the US hosts in the allowlist.
[OUTPUT]
    Name          nrlogs
    Match         mariadb.slowlog.*
    base_uri      https://log-api.eu.newrelic.com/log/v1
    license_key   ${NRIA_LICENSE_KEY}
