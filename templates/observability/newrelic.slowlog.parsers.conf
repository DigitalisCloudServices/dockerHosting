# Fluent Bit parsers for the MariaDB slow query log.
# Managed by dockerHosting - do not edit by hand. Deployed by install-observability.sh
# to /opt/observability/newrelic/fluent-bit/mariadb-slowlog.parsers.conf and named as
# Parsers_File by fluent-bit.conf (newrelic.fluent-bit.conf).
#
# A slow-log entry is several lines: "# Time:" (only when the second changes),
# "# User@Host:", "# Thread_id:", "# Query_time:", more "#" lines, the explain
# lines of log_slow_verbosity=explain, "SET timestamp=...;" and the statement,
# which may itself span lines. Every entry starts at its "# User@Host:" line, so a
# "# Time:" line lands at the end of the entry before it; the Lua filter ignores
# "#" lines. A restart banner lands there too, and the filter drops it as well.
#
# flush_timeout releases the last entry of a quiet log instead of holding it for
# the next one.
[MULTILINE_PARSER]
    name          mariadb-slowlog
    type          regex
    flush_timeout 2000
    rule          "start_state"  "/^# User@Host:/"          "cont"
    rule          "cont"         "/^(?!# User@Host:).*/"    "cont"
